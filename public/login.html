<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Sourcing Desk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --paper: #E7E3D8;
    --paper-raised: #F1EEE4;
    --ink: #23261F;
    --ink-soft: #5B5A4D;
    --rule: #C9C3AF;
    --teal: #2B6E63;
    --teal-deep: #1D4B43;
    --amber: #B9822F;
    --rust: #9C4A3A;
    --card-shadow: 0 1px 0 rgba(35,38,31,0.06), 0 8px 20px -12px rgba(35,38,31,0.35);
    --radius: 3px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  body::before{
    content:"";
    position: fixed; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(35,38,31,0.015) 0px, rgba(35,38,31,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    z-index:0;
  }

  .card{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    padding: 32px 28px 28px;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--teal-deep);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1.title{
    font-family:'Roboto Slab', Georgia, serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 22px;
    letter-spacing: -0.01em;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
  }

  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 5px;
    color: var(--ink);
  }
  .field input{
    width:100%;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 9px 10px;
    background: #FBFAF6;
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--ink);
  }
  .field input:focus{
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 2px rgba(43,110,99,0.18);
  }

  button.submit{
    width:100%;
    margin-top: 6px;
    padding: 12px 16px;
    background: var(--ink);
    color: var(--paper-raised);
    border:none;
    border-radius: 2px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.submit:hover:not(:disabled){ background: var(--teal-deep); }
  button.submit:disabled{ opacity: 0.5; cursor: not-allowed; }

  .form-error{
    font-size: 11.5px;
    color: var(--rust);
    margin-top: 10px;
    font-family:'IBM Plex Mono', monospace;
    display:none;
    line-height: 1.5;
  }

  .footnote{
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed var(--rule);
    font-size: 11px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow">Talent Sourcing / Internal Tool</p>
  <h1 class="title">Sign in to Sourcing Desk</h1>

  <form id="loginForm">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="username" placeholder="you@chiparama.com" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
    </div>
    <button type="submit" class="submit" id="submitBtn">Sign in</button>
    <div class="form-error" id="formError"></div>
  </form>

  <div class="footnote">
    No self-serve sign-up — accounts are added by an admin in Supabase.
    Trouble signing in? Ask whoever set up your access.
  </div>
</div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const form = $("loginForm");
  const submitBtn = $("submitBtn");
  const formError = $("formError");

  const params = new URLSearchParams(window.location.search);
  const redirectTo = params.get("redirect") || "/";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    formError.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in…";

    try{
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: $("email").value.trim(), password: $("password").value })
      });
      const data = await res.json();
      if(!res.ok || data.error) throw new Error(data.error || "Sign in failed.");
      window.location.href = redirectTo.startsWith("/") ? redirectTo : "/";
    } catch(err){
      formError.textContent = err.message;
      formError.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign in";
    }
  });
})();
</script>
</body>
</html>
